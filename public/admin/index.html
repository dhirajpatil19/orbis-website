<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbis — Content Manager</title>
    <!-- Netlify Identity: powers the login for the admin dashboard -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS (fork of Netlify CMS) admin SPA -->
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
    <script>
      // Auto-refresh after identity login/logout so the CMS picks up the session.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => document.location.reload());
          }
        });
      }
    </script>
  </body>
</html>
